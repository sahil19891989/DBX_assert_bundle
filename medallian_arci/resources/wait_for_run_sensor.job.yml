resources:
  jobs:
    wait_for_run_sensor:
      name: "[example] wait_for_run_sensor"

      tasks:
        - task_key: wait_for_run_sensor
          environment_key: medallian_arci_environment
          python_operator_task:
            main: medallian_arci.examples.wait_for_run_sensor.WaitForRunSensor
            parameters:
              - name: "run_id"
                value: "CHANGEME"

      environments:
        - environment_key: medallian_arci_environment
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
