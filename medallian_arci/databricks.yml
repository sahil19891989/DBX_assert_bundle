# This is a Declarative Automation Bundle definition for medallian_arci.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: medallian_arci
  uuid: dd4204f6-8ba5-45b8-9be8-9c830cdcb076
  engine: direct

# Per-environment variables. Override these per target in the targets: block below.
variables:
  catalog:
    description: Unity Catalog catalog for the pipeline tables
    default: metlife_dmo
  schema:
    description: Schema for the pipeline tables
    default: lapse

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel
  lakeflow_integrations_yaml:
    # inlined Python so the build is portable across Linux/Mac/Windows
    build: >
      uv run python -c "import shutil;
      shutil.rmtree('__generated__', ignore_errors=True);
      from databricks.lakeflow.integrations.generator.generate import main;
      main([
        '--package-module', 'medallian_arci',
        '--output-dir', '__generated__',
        '--environment-version', '5',
        '--environment-key', 'medallian_arci_environment',
        '--dependency', '${workspace.artifact_path}/.internal/medallian_arci-0.0.1-py3-none-any.whl',
      ])"
    files:
      - {"source": "__generated__/*.yml",}

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    variables:
      catalog: metlife_dmo
      schema: lapse
    workspace:
      host: https://dbc-b0831a76-fe87.cloud.databricks.com
  prod:
    mode: production
    variables:
      catalog: metlife_dmo
      schema: lapse
    workspace:
      host: https://dbc-b0831a76-fe87.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sahilguglani1989@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sahilguglani1989@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: sahilguglani1989@gmail.com
        level: CAN_MANAGE
